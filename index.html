    <script>
      (function () {
        // 1) 声明音频会话为"媒体播放"（Safari 16.4+）
        try {
          if (navigator.audioSession) navigator.audioSession.type = 'playback';
        } catch (e) {}
  
        // 2) 劫持 AudioContext：被系统中断后自动恢复
        var RealAC = window.AudioContext || window.webkitAudioContext;
        if (!RealAC) return;
  
        function PatchedAC(options) {
          var ctx = new RealAC(options);
          ctx.onstatechange = function () {
            if (ctx.state === 'interrupted') {
              ctx.resume().catch(function () {});
            }
          };
          return ctx;
        }
        PatchedAC.prototype = RealAC.prototype;
        window.AudioContext = PatchedAC;
        window.webkitAudioContext = PatchedAC;
      })();
    </script>

<!-- 首屏加载遮罩：内联样式，随 HTML 首帧一起绘制，不等 index.css 与 JS bundle。
         由 src/utils/appSplash.ts 在 React 挂载后淡出并移除。 -->
    <style>
      html,
      body {
        background-color: #09090b;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #09090b;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 320ms ease;
      }

      #app-splash.is-hiding {
        opacity: 0;
        pointer-events: none;
      }

      #app-splash .app-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        opacity: 0;
        /* 延迟淡入：命中缓存的秒开不会闪一下遮罩内容。 */
        animation: app-splash-in 420ms ease 180ms forwards;
      }

      #app-splash .app-splash-title {
        /* 巨大字号，随视口收缩，窄屏也不会溢出。 */
        font-size: clamp(64px, 17vw, 200px);
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.06em;
        text-indent: 0.06em;
      }

      /* 每个字母占一个固定宽度的盒子（宽度由脚本按各字体的最大字宽测出来，单位 em，
         跟着 font-size 缩放），字体来回切换时字形变但排版不抖。
         纯白 + text-shadow 辉光，辉光强度由脚本逐字母随机，这里的值是脚本失败时的兜底。 */
      #app-splash .app-splash-title span {
        display: inline-block;
        text-align: center;
        font-family: inherit;
        color: #ffffff;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.55), 0 0 28px rgba(255, 255, 255, 0.3);
        /* 缩放原点压到基线附近，字母大小浮动时底边大致对齐。 */
        transform-origin: center 78%;
      }

      /* 循环波形：每根竖条只做 transform 动画，合成器线程执行，不占主线程。 */
      #app-splash .app-splash-wave {
        display: flex;
        align-items: center;
        gap: clamp(6px, 1.1vw, 11px);
        height: clamp(42px, 7.5vw, 92px);
      }

      /* --floor / --peak / --alpha / --glow / --w 由下面的内联脚本逐条随机化；
         这里的默认值是脚本失败时的静态兜底。纯白平涂 + 外发光，不做渐变。 */
      #app-splash .app-splash-wave span {
        width: var(--w, 5px);
        height: 100%;
        transform: scaleY(var(--floor, 0.18));
        background-color: rgba(255, 255, 255, var(--alpha, 0.85));
        box-shadow: 0 0 var(--glow, 14px) rgba(255, 255, 255, 0.35);
        animation: app-splash-wave 1100ms ease-in-out infinite;
      }

      #app-splash .app-splash-wave span:nth-child(even) {
        animation-delay: -550ms;
      }

      @keyframes app-splash-in {
        to {
          opacity: 1;
        }
      }

      @keyframes app-splash-wave {
        0%,
        100% {
          transform: scaleY(var(--floor, 0.18));
        }
        50% {
          transform: scaleY(var(--peak, 1));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash .app-splash-inner {
          opacity: 1;
          animation: none;
        }

        #app-splash .app-splash-wave span {
          /* 不动，但保留随机高度，静态波形仍然有形状。 */
          transform: scaleY(calc(var(--peak, 0.5) * 0.7));
          animation: none;
          opacity: 0.5;
        }
      }
    </style>
</head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Loading Folia">

        <div class="app-splash-wave" aria-hidden="true">
          <span></span>

    <script>
      (function () {
        try {
          // 需要透明背景的入口不能盖遮罩：OBS 浏览器源会被直接推流捕获，
          // Electron 的透明播放背景 / 壁纸窗口（main.cjs 传 splash=0）会在桌面上闪一个黑块。
          var params = new URLSearchParams(window.location.search);
          if (params.get('obs') === '1' || window.location.pathname === '/obs' || params.get('splash') === '0') {
            var splash = document.getElementById('app-splash');
            if (splash) {
              splash.remove();
            }
            return;
          }
        } catch (error) {
          // 探测失败时保留遮罩，React 挂载后仍会移除它。
        }

        // 波形逐条随机化：高度、宽度、节奏、相位和颜色都带抖动，每次加载的形状都不一样。
        // 同步执行，在首帧绘制前完成；失败时 CSS 里的默认值会兜底成一条静态波形。
        try {
          var rand = function (min, max) {
            return min + Math.random() * (max - min);
          };

          var bars = document.querySelectorAll('#app-splash .app-splash-wave span');
          for (var i = 0; i < bars.length; i += 1) {
            var bar = bars[i];
            // 中间高、两端低的整体包络，再叠加随机量，形状既像波形又不规整。
            var envelope = Math.sin(((i + 0.5) / bars.length) * Math.PI);
            var peak = Math.min(1, 0.32 + envelope * rand(0.38, 0.72));
            bar.style.setProperty('--peak', peak.toFixed(3));
            bar.style.setProperty('--floor', rand(0.08, 0.24).toFixed(3));
            bar.style.setProperty('--w', rand(3.5, 6.5).toFixed(2) + 'px');
            // 白色平涂，只在亮度和辉光半径上留随机：高的条更亮、光晕更散。
            bar.style.setProperty('--alpha', rand(0.55, 1).toFixed(2));
            bar.style.setProperty('--glow', Math.round(rand(6, 26)) + 'px');
            bar.style.animationDuration = Math.round(rand(820, 1500)) + 'ms';
            bar.style.animationDelay = '-' + Math.round(rand(0, 1500)) + 'ms';
          }
        } catch (error) {
          // 随机化失败无所谓，CSS 默认值已经能跑一条波形。
        }

        // Folia 五个字母不断跳到不同字形（Loki 片头那种字体轮盘），偶尔整体落回基准样式。
        // 只用通用字族，再叠加字重、斜体和横向拉伸——不同机器上装的字体不一样，
        // 单靠字体名会退化成同一张脸，加上这几个轴才保证每次跳变都看得出来。
        try {
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            return;
          }
          var BASE_FONT = "'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif";
          var FAMILIES = [BASE_FONT, 'serif', 'monospace', 'cursive', 'fantasy', 'system-ui'];
          var WEIGHTS = ['400', '600', '800'];
          var SCALES = [0.86, 0.94, 1, 1.06, 1.12];
          var letters = document.querySelectorAll('#app-splash .app-splash-title span');
          if (!letters.length) {
            return;
          }

          // 用 canvas 在 100px 基准下量出每个字母在所有候选字形里的最大宽度，换算成 em 写死盒子宽度，
          // 这样字形来回换、词标整体不会左右乱跳。
          var measure = document.createElement('canvas').getContext('2d');
          for (var m = 0; m < letters.length; m += 1) {
            var glyph = letters[m].textContent;
            var widest = 0;
            for (var f = 0; f < FAMILIES.length; f += 1) {
              measure.font = 'italic 800 100px ' + FAMILIES[f];
              widest = Math.max(widest, measure.measureText(glyph).width);
              measure.font = '800 100px ' + FAMILIES[f];
              widest = Math.max(widest, measure.measureText(glyph).width);
            }
            if (widest > 0) {
              // 余量留给最大的缩放组合（1.12 × 1.12），字形放大时不会压到相邻字母。
              letters[m].style.width = ((widest / 100) * 1.26 + 0.04).toFixed(3) + 'em';
            }
          }

          var pick = function (list) {
            return list[Math.floor(Math.random() * list.length)];
          };
          var jitter = function (min, max) {
            return min + Math.random() * (max - min);
          };
          // 辉光分三档：干净、微光、过曝。片头里字母亮度参差不齐，靠这个模拟。
          var randomGlow = function () {
            var roll = Math.random();
            if (roll < 0.3) {
              return '0 0 ' + (2 + Math.random() * 4).toFixed(1) + 'px rgba(255,255,255,0.35)';
            }
            if (roll < 0.75) {
              return '0 0 ' + (6 + Math.random() * 8).toFixed(1) + 'px rgba(255,255,255,0.7), 0 0 ' +
                (20 + Math.random() * 16).toFixed(1) + 'px rgba(255,255,255,0.35)';
            }
            return '0 0 ' + (10 + Math.random() * 8).toFixed(1) + 'px rgba(255,255,255,0.95), 0 0 ' +
              (34 + Math.random() * 20).toFixed(1) + 'px rgba(255,255,255,0.7), 0 0 ' +
              (70 + Math.random() * 40).toFixed(1) + 'px rgba(255,255,255,0.45)';
          };
          var timer = window.setInterval(function () {
            // 遮罩被移除后自己停掉，不留空转的定时器。
            if (!document.getElementById('app-splash')) {
              window.clearInterval(timer);
              return;
            }
            // 一拍只换一个字母，偶尔两个，节奏克制。
            var swaps = Math.random() < 0.25 ? 2 : 1;
            for (var i = 0; i < swaps; i += 1) {
              var letter = pick(letters);
              letter.style.fontFamily = pick(FAMILIES);
              letter.style.fontWeight = pick(WEIGHTS);
              letter.style.fontStyle = Math.random() < 0.25 ? 'italic' : 'normal';
              // 大小和宽窄都用 transform 做：不进入布局，盒子宽度不受影响，排版才不会抖。
              var sizeScale = jitter(0.86, 1.12);
              letter.style.transform =
                'scale(' + (sizeScale * pick(SCALES)).toFixed(3) + ',' + sizeScale.toFixed(3) + ')';
              letter.style.textShadow = randomGlow();
            }
          }, 380);
        } catch (error) {
          // 字体轮盘失败就保持静态词标。
        }
      })();
    </script>

<style>
  #donate-mask{position:fixed;inset:0;display:none;align-items:center;justify-content:center;

<div id="donate-mask">
  <div id="donate-card">
    <div class="donate-title">给 Ex 赞赏</div>
    <img src="/appreciate-qr.jpg" alt="赞赏码">
    <p>如果 Folia 帮到你了，可以请我喝杯咖啡 ❤️</p>
    <p class="hint">长按二维码可保存到相册</p>
    <button id="donate-close">关闭</button>
  </div>
</div>

<script>
(function(){
  // OBS 浏览器源 / 透明背景 / 免开屏模式：不弹
  try {
    var p = new URLSearchParams(window.location.search);
    if (p.get('obs') === '1' || window.location.pathname === '/obs' || p.get('splash') === '0') return;
  } catch (e) {}

  var mask = document.getElementById('donate-mask');
  if (!mask) return;

  // 每次冷启动只弹一次：App 大退重进 = 新 WebView = 会再弹；同一次会话内刷新不重复弹
  var KEY = 'folia.donate.shown';
  var shown = false;
  try { shown = sessionStorage.getItem(KEY) === '1'; } catch (e) {}
  if (!shown) {
    setTimeout(function(){ mask.classList.add('show'); }, 1600);
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
  }

  document.getElementById('donate-close').addEventListener('click', function(){ mask.classList.remove('show'); });
  mask.addEventListener('click', function(e){ if (e.target === mask) mask.classList.remove('show'); });
})();
</script>

<!-- ========== 启动失败兜底（不依赖任何模块） ========== -->
<div id="boot-fail" style="display:none;position:fixed;inset:0;z-index:2147483600;background:#0b0b0d;color:#eee;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:14px/1.7 -apple-system,system-ui,'Segoe UI',sans-serif">
  <div style="font-size:17px;font-weight:600">页面没能加载完成</div>
  <div id="boot-fail-detail" style="color:#98a2b3;font-size:12px;max-width:32em;word-break:break-all"></div>
  <button id="boot-fail-reload" style="border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:9px 20px;font-size:13px;color:#e5e7eb;background:transparent;cursor:pointer;margin-right:8px">重新加载</button><button id="boot-fail-retry" style="border:0;border-radius:999px;padding:11px 26px;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,#ff7e9d,#ff4d6d);cursor:pointer">清除缓存并重试</button>
  <div style="color:#6b7280;font-size:12px;max-width:30em">如果一直失败，通常是网络到 Cloudflare 不通：换个网络（如切 4G/5G）或稍后再试。</div>
</div>
<script>
(function () {
  var revealed = false;
  function reveal(msg) {
    if (revealed) return; revealed = true;
    var el = document.getElementById('boot-fail');
    if (!el) return;
    el.style.display = 'flex';
    var d = document.getElementById('boot-fail-detail');
    if (d && msg) d.textContent = msg;
  }
  setTimeout(function () {
    if (document.getElementById('app-splash')) reveal('等待超时：脚本可能没下载完，或浏览器缓存了旧版本。');
  }, 8000);
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (t && t.tagName === 'SCRIPT') { reveal('脚本加载失败：' + (t.src || '未知地址')); return; }
    if (t && t.tagName === 'IMG') return;
    var msg = (e && (e.message || (e.error && e.error.message))) || '';
    var where = e && e.filename ? (' @ ' + e.filename + ':' + (e.lineno || 0)) : '';
    reveal('运行时错误：' + (msg || '未知错误') + where);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    var text = r && (r.message || String(r));
    if (r && String(r).indexOf('Importing a module script failed') >= 0) { reveal('模块加载失败：' + String(r)); return; }
    if (text) reveal('未处理的异常：' + String(text).slice(0, 300));
  });
  var reloadBtn = document.getElementById('boot-fail-reload');
  if (reloadBtn) reloadBtn.addEventListener('click', function () { location.reload(); });
  var btn = document.getElementById('boot-fail-retry');
  if (btn) btn.addEventListener('click', function () {
    if (btn.dataset.busy === '1') return;
    btn.dataset.busy = '1';
    btn.disabled = true;
    btn.textContent = '正在清理…';
    var done = false;
    // 无论如何 2.5 秒内都要走：iOS 上 caches.delete 可能卡很久，不能一直转圈。
    var go = function () {
      if (done) return;
      done = true;
      location.replace(location.pathname + '?fresh=' + Date.now());
    };
    var cap = function (promise, ms) {
      return Promise.race([
        Promise.resolve(promise).catch(function () {}),
        new Promise(function (resolve) { setTimeout(resolve, ms); }),
      ]);
    };
    var jobs = [];
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(cap(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (x) { return x.unregister(); }));
        }), 1500));
      }
      if (window.caches && caches.keys) {
        jobs.push(cap(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }), 1200));
      }
    } catch (err) {}
    Promise.all(jobs).then(go, go);
    setTimeout(go, 2500);
  });
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (x) { try { x.update(); } catch (e) {} });
      }).catch(function () {});
    }
  } catch (e) {}
})();
</script>
<!-- ========== 启动失败兜底 结束 ========== -->  </body>
