name: Build iOS ipa

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npx vite build
        env:

          VITE_NETEASE_API_BASE: 'https://netease.folia-api.top'
          VITE_QQ_API_BASE:  /api/qq
          VITE_KUGOU_API_BASE: /api/kugou



      - name: Pin remote URL
        run: |
          python3 - <<'PY'
          import io, json
          p = 'capacitor.config.json'
          cfg = json.load(io.open(p, encoding='utf-8'))
          srv = cfg.setdefault('server', {})
          srv['androidScheme'] = 'https'
          srv['url'] = 'https://app.folia-api.top'
          srv['cleartext'] = True
          io.open(p, 'w', encoding='utf-8').write(json.dumps(cfg, ensure_ascii=False, indent=2))
          print(io.open(p, encoding='utf-8').read())
          PY
      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Show ios folder structure
        run: find ios -maxdepth 3 | head -n 100

      - name: Archive unsigned
        run: |
          set -e
          PROJ_DIR=$(dirname "$(find ios -maxdepth 3 -name '*.xcodeproj' | head -n 1)")
          echo "Xcode project folder: $PROJ_DIR"
          cd "$PROJ_DIR"
          SCHEME=$(xcodebuild -list 2>/dev/null | sed -n '/Schemes:/,$p' | sed -n '2p' | xargs)
          if [ -z "$SCHEME" ]; then SCHEME=$(basename "$(find . -maxdepth 1 -name '*.xcodeproj' | head -n 1)" .xcodeproj); fi
          echo "Scheme: $SCHEME"
          WS=$(find . -maxdepth 1 -name '*.xcworkspace' | head -n 1)
          if [ -n "$WS" ]; then
            echo "Using workspace: $WS"
            xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -archivePath "$PWD/out.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""
          else
            PROJ=$(find . -maxdepth 1 -name '*.xcodeproj' | head -n 1)
            echo "Using project: $PROJ"
            xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release -archivePath "$PWD/out.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""
          fi

      - name: Package as ipa
        run: |
          APP_PATH=$(find ios -type d -name '*.app' -path '*Products/Applications*' | head -n 1)
          echo "App found at: $APP_PATH"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r App-unsigned.ipa Payload

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-unsigned
          path: App-unsigned.ipa
